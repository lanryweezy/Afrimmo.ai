<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#020617" />

  <!-- Decorative Elements -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:0" />
    </linearGradient>
  </defs>

  <circle cx="1100" cy="100" r="300" fill="url(#grad1)" />
  <circle cx="100" cy="530" r="200" fill="url(#grad2)" />

  <!-- Grid pattern -->
  <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300 M 0 400 L 1200 400 M 0 500 L 1200 500 M 100 0 L 100 630 M 200 0 L 200 630 M 300 0 L 300 630 M 400 0 L 400 630 M 500 0 L 500 630 M 600 0 L 600 630 M 700 0 L 700 630 M 800 0 L 800 630 M 900 0 L 900 630 M 1000 0 L 1000 630 M 1100 0 L 1100 630" stroke="white" stroke-width="0.5" stroke-opacity="0.05" />

  <!-- Logo/Icon -->
  <g transform="translate(100, 200)">
    <path d="M 0 50 L 60 0 L 120 50 L 120 120 L 0 120 Z" fill="none" stroke="#10b981" stroke-width="8" />
    <path d="M 40 120 L 40 80 L 80 80 L 80 120" fill="none" stroke="#10b981" stroke-width="8" />
    <circle cx="60" cy="40" r="15" fill="#10b981" opacity="0.3" />
    <path d="M 140 20 L 160 40 L 140 60" fill="none" stroke="#10b981" stroke-width="4" />
    <path d="M 170 40 L 200 40" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="4 4" />
  </g>

  <!-- Text Content -->
  <text x="100" y="400" font-family="Inter, sans-serif" font-size="80" font-weight="bold" fill="white">
    Afrimmo <tspan fill="#10b981">AI</tspan>
  </text>
  <text x="100" y="470" font-family="Inter, sans-serif" font-size="32" fill="#94a3b8">
    AI-Powered Real Estate Agent for Africa
  </text>

  <!-- Features -->
  <g transform="translate(100, 530)">
    <rect width="180" height="40" rx="20" fill="#1e293b" stroke="#334155" />
    <text x="90" y="26" font-family="Inter, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">WhatsApp CRM</text>

    <rect x="200" width="180" height="40" rx="20" fill="#1e293b" stroke="#334155" />
    <text x="290" y="26" font-family="Inter, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">Viral Marketing</text>

    <rect x="400" width="180" height="40" rx="20" fill="#1e293b" stroke="#334155" />
    <text x="490" y="26" font-family="Inter, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">Lead Scoring</text>
  </g>

  <!-- Badge -->
  <g transform="translate(1000, 530)">
    <circle cx="50" cy="50" r="40" fill="#10b981" fill-opacity="0.1" />
    <text x="50" y="58" font-family="Inter, sans-serif" font-size="24" fill="#10b981" text-anchor="middle" font-weight="bold">AI</text>
  </g>
</svg>
